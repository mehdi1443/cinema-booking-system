global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'cinema.alerts@gmail.com'
  smtp_auth_username: 'cinema.alerts@gmail.com'
  smtp_auth_password: '${SMTP_APP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'backend-team-email'

receivers:
  - name: 'backend-team-email'
    email_configs:
      - to: 'admin@cinemabooking.com'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']