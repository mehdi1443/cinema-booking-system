# version: "3.8"

services:
  db:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: ${POSTGRES_CONTAINER:-cinema_postgres_db}
    restart: always
    environment:
      POSTGRES_USER: ${PDB_USER}
      POSTGRES_PASSWORD: ${PDB_PASSWORD}
      POSTGRES_DB: ${PDB_DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT:-15015}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDB_USER} -d ${PDB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: ${REDIS_CONTAINER:-cinema_redis_cache}
    restart: always
    command: redis-server --requirepass ${RDB_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-15016}:6379"
    volumes:
      - redisdata:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: ${PGADMIN_CONTAINER:-cinema_pgadmin}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-15017}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - cinema_network
    env_file:
      - .env

  minio:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER:-cinema_minio}
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-15018}:9000"
      - "${MINIO_CONSOLE_PORT:-15019}:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - cinema_network
    env_file:
      - .env

volumes:
  pgdata:
  redisdata:
  pgadmin_data:
  miniodata:

networks:
  cinema_network:
    driver: bridge