services:
  db:
    image: postgres:15-alpine
    pull_policy: never
    container_name: ${POSTGRES_CONTAINER:-cinema_postgres_db}
    restart: always
    environment:
      POSTGRES_USER: ${PDB_USER}
      POSTGRES_PASSWORD: ${PDB_PASSWORD}
      POSTGRES_DB: ${PDB_DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT:-15015}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDB_USER} -d ${PDB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: ${REDIS_CONTAINER:-cinema_redis_cache}
    restart: always
    command: redis-server --requirepass ${RDB_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-15016}:6379"
    volumes:
      - redisdata:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${RDB_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    pull_policy: missing
    container_name: ${RABBITMQ_CONTAINER:-cinema_rabbitmq}
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    pull_policy: never
    container_name: ${PGADMIN_CONTAINER:-cinema_pgadmin}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-15017}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - cinema_network
    env_file:
      - .env

  minio:
    image: minio/minio:latest
    pull_policy: never
    container_name: ${MINIO_CONTAINER:-cinema_minio}
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-15018}:9000"
      - "${MINIO_CONSOLE_PORT:-15019}:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - cinema_network
    env_file:
      - .env

  # ===================================
  # ELK Stack Services
  # ===================================
  elasticsearch:
    image: elasticsearch:8.11.1
    pull_policy: never
    container_name: ${ELASTICSEARCH_CONTAINER:-cinema_elasticsearch}
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cinema_network
    env_file:
      - .env

  kibana:
    image: elastic/kibana:8.11.1
    pull_policy: never
    container_name: ${KIBANA_CONTAINER:-cinema_kibana}
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-15020}:5601"
    depends_on:
      - elasticsearch
    networks:
      - cinema_network
    env_file:
      - .env

  filebeat:
    image: elastic/filebeat:8.11.1
    pull_policy: never
    container_name: ${FILEBEAT_CONTAINER:-cinema_filebeat}
    restart: always
    user: root
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    volumes:
      - ./filebeat.yaml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/cinema:ro
    environment:
      - STRICT_PERMS=false
    depends_on:
      - elasticsearch
    networks:
      - cinema_network
    env_file:
      - .env

  # ===================================
  # Prometheus & Grafana Stack
  # ===================================
  prometheus:
    image: prom/prometheus:v2.48.1
    pull_policy: never
    container_name: ${PROMETHEUS_CONTAINER:-cinema_prometheus}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-15021}:9090"
    networks:
      - cinema_network
    env_file:
      - .env

  alertmanager:
    image: prom/alertmanager:v0.26.0
    pull_policy: never
    container_name: ${ALERTMANAGER_CONTAINER:-cinema_alertmanager}
    restart: always
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-15022}:9093"
    networks:
      - cinema_network
    env_file:
      - .env

  grafana:
    image: grafana/grafana:10.2.3
    pull_policy: never
    container_name: ${GRAFANA_CONTAINER:-cinema_grafana}
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-15023}:3000"
    depends_on:
      - prometheus
    networks:
      - cinema_network
    env_file:
      - .env

  node-exporter:
    image: prom/node-exporter:v1.7.0
    pull_policy: never
    container_name: ${NODE_EXPORTER_CONTAINER:-cinema_node_exporter}
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "${NODE_EXPORTER_PORT:-15024}:9100"
    networks:
      - cinema_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    pull_policy: never
    container_name: ${POSTGRES_EXPORTER_CONTAINER:-cinema_postgres_exporter}
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${PDB_USER}:${PDB_PASSWORD}@db:5432/${PDB_DB_NAME}?sslmode=${PDB_SSL_MODE}"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-15025}:9187"
    depends_on:
      - db
    networks:
      - cinema_network

volumes:
  pgdata:
  redisdata:
  pgadmin_data:
  miniodata:
  esdata:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

networks:
  cinema_network:
    driver: bridge
